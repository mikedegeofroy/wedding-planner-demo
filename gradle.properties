onnoVersion=3.3.2

# The tenant build runs inside kaniko on a 3 GiB node with no container memory limit, so a JVM left
# to itself sizes its heap off the whole node and Gradle's daemon adds a second one. Kaniko then
# needs its own gigabyte to snapshot the image, and the kubelet evicts whichever of them it reaches
# first — every build so far died that way. Capped here because the build has to fit the machine it
# is built on, not the one it was written on.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
