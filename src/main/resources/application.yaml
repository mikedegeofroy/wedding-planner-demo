spring:
  application:
    name: planner
  datasource:
    # The deployment supplies these; the defaults are the local H2 file. No driver-class-name on
    # purpose — pinning it to H2 is what made a tenant pod crash-loop against its Postgres URL,
    # since the driver then contradicts the URL it is handed.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/wedding-planner;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # An inbox read holds its connection for the whole page, and the screen fires several at once
      # while a workspace is switched. Ten was enough to leave requests queueing behind each other
      # and then failing outright on "Failed to obtain JDBC Connection"; the pool is the queue, and
      # it was shorter than the traffic. Postgres is configured for far more than this.
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:20}

server:
  error:
    include-message: always

# The events side of the demo — crew, venues, the event book and its ledger — is seeded behind this
# flag. It was never set here, so a database built from empty had inquiries and nothing else: every
# role folder read zero and the Events section was bare. The old data file only had them because a
# run somewhere once turned this on.
planner:
  events:
    demo: true
  # Jev (TypeSafe) reads a stranger's first message and files it. The key never lives here: without
  # one the classifier answers with keyword rules, and the chat card says which of the two it was.
  jev:
    api-key: ${TYPESAFE_API_KEY:}
    model: ${TYPESAFE_MODEL:jev-latest}
  # POST /demo-hooks/inbound {"scenario":"couple-como"} plays a new sender writing in. Without a
  # token only this machine may call it; set one to trigger it from a phone or another laptop.
  demo-hooks:
    enabled: ${PLANNER_DEMO_HOOKS_ENABLED:true}
    # Open to any device that can reach the app, no token. Fine on a laptop for a live demo; turn it
    # off (PLANNER_DEMO_HOOKS_OPEN=false) anywhere public — every call writes a chat and spends Jev credits.
    open: ${PLANNER_DEMO_HOOKS_OPEN:true}
    token: ${PLANNER_DEMO_HOOK_TOKEN:}

onno:
  ui:
    locale: en
    login:
      demo-accounts:
        - label: Open Wedding Planner demo
          username: demo@weddingplanner.local
          password: demo
  comments:
    enabled: true
  auth:
    mode: in-memory
    # Replaces the default list, so the login path stays. /demo-hooks guards itself with a token.
    csrf-ignored-paths: [/api/auth/login, /demo-hooks/**]
    demo:
      auto-login-username: demo@weddingplanner.local
    session:
      remember-me:
        allow-ephemeral-key: true
    users:
      - username: demo@weddingplanner.local
        password: demo
        roles: [MANAGER]
